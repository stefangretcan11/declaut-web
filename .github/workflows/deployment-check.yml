name: Check deployment

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Exact HTTPS deployment origin supplied by the owner
        type: string
        required: true

permissions:
  contents: read

jobs:
  pages-and-auth-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check public pages and application authentication response
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: node scripts/check-deployment.mjs
